name: Validate H4_T3 bot
on:
  push:
    branches:
      - hussain/fixes-2026-11-04
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check bot syntax
        run: node --check H_fixed.js
